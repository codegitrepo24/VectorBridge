
<div class="container mt-5">
  
  <div class="row justify-content-center">
    <div class="col-md-8 text-center">
      <h2 class="mb-3 fw-bold text-primary">AI Semantic Search</h2>
      <p class="text-muted mb-4">Search your support database by meaning, concepts, and intent—not just exact keywords.</p>
      
      <div class="input-group input-group-lg mb-3 shadow-sm">
        <input type="text" class="form-control" placeholder="e.g. 'I can't access my account'" 
               [(ngModel)]="searchQuery" (keyup.enter)="performSearch()">
        
        <button class="btn btn-primary px-4" (click)="performSearch()" [disabled]="isLoading">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
          Search
        </button>
      </div>
    </div>
  </div>

  <div class="row justify-content-center mt-4">
    <div class="col-md-8">
      
      <div *ngIf="hasSearched && !isLoading && results.length === 0" class="alert alert-warning text-center">
        No matches found in the database.
      </div>

      <div *ngIf="results.length > 0" class="list-group">
        
        <div *ngFor="let result of results" class="list-group-item list-group-item-action mb-3 shadow-sm rounded border-0 border-start border-5 border-primary">
          <div class="d-flex w-100 justify-content-between align-items-center">
            <h5 class="mb-1 text-secondary">Ticket ID: {{ result.sourceId }}</h5>
            
            <span class="badge bg-success rounded-pill fs-6 py-2 px-3">
              {{ (result.similarityScore * 100) | number:'1.1-1' }}% Match
            </span>
          </div>
          <p class="mb-1 mt-2 fs-5 fw-medium">{{ result.textContent }}</p>
          <small class="text-muted">Source: {{ result.sourceTable }}</small>
        </div>

      </div>

    </div>
  </div>
</div>
