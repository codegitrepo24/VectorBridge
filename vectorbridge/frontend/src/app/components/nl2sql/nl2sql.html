<div class="container mt-5">
  
  <div class="row justify-content-center">
    <div class="col-md-10 text-center">
      <h2 class="mb-3 fw-bold text-success">Ask the Database</h2>
      <p class="text-muted mb-4">Type a natural language question, review the AI's query, and fetch live data.</p>
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="col-md-10">
      
      <div *ngIf="errorMessage" class="alert alert-danger shadow-sm border-0 mb-4">
        <strong>Error:</strong> {{ errorMessage }}
      </div>

      <div *ngIf="!generatedSql" class="card shadow-sm border-0 mb-4">
        <div class="card-body p-4 text-center">
          <div class="input-group input-group-lg">
            <input type="text" class="form-control" placeholder="e.g. 'Show me the names of our top 5 customers'" 
                   [(ngModel)]="question" (keyup.enter)="generateSql()" [disabled]="isGenerating">
            
            <button class="btn btn-success px-4" (click)="generateSql()" [disabled]="isGenerating || !question">
              <span *ngIf="isGenerating" class="spinner-border spinner-border-sm me-2"></span>
              Generate SQL
            </button>
          </div>
        </div>
      </div>

      <div *ngIf="generatedSql && !aiResponse" class="card shadow border-success mb-4">
        <div class="card-header bg-success text-white fw-bold d-flex justify-content-between align-items-center">
          <span>Review Generated SQL</span>
          <button class="btn btn-sm btn-outline-light" (click)="startOver()">Start Over</button>
        </div>
        <div class="card-body bg-light p-4">
          <label class="form-label text-muted small fw-bold text-uppercase">You can edit the query below before running it:</label>
          <textarea class="form-control font-monospace mb-3 shadow-sm border-0" rows="4" [(ngModel)]="generatedSql"></textarea>
          
          <div class="d-grid gap-2 d-md-flex justify-content-md-end">
            <button class="btn btn-primary px-4" (click)="runSql()" [disabled]="isExecuting">
              <span *ngIf="isExecuting" class="spinner-border spinner-border-sm me-2"></span>
              Run Query
            </button>
          </div>
        </div>
      </div>

      <div *ngIf="aiResponse" class="card shadow border-0 mb-4">
        <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center">
          <span>AI Query Results</span>
          <button class="btn btn-sm btn-outline-light" (click)="startOver()">Ask Another Question</button>
        </div>
        
        <div class="card-body p-0">
          <div *ngIf="aiResponse.length === 0" class="p-4 text-center text-muted">
            The query executed successfully, but returned 0 rows.
          </div>

          <div *ngIf="aiResponse.length > 0" class="table-responsive">
            <table class="table table-striped table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th *ngFor="let header of getColumnHeaders(aiResponse)" class="text-uppercase text-secondary fs-6">
                    {{ header }}
                  </th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let row of aiResponse">
                  <td *ngFor="let header of getColumnHeaders(aiResponse)">
                    {{ row[header] }}
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="card-footer text-muted text-end small">
          Returned {{ aiResponse.length }} rows
        </div>
      </div>

    </div>
  </div>
</div>
